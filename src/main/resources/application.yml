spring:
  application:
    name: mybatisplus-example
  datasource:
    # 1. 明确指定 Druid 连接池
    type: com.alibaba.druid.pool.DruidDataSource
    # 2. MySQL 8.x 标准驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mybatisplus_demo?useUnicode=true&characterEncoding=utf8
    username: root
    password: 1
mybatis-plus:
  configuration:
    # 打印执行的 SQL 语句（标准输出）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
